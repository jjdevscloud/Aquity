[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
solc = "0.8.26"
# DeployLocalDemo.s.sol writes local-demo-output.json / local-demo-env.json
# for run-local-demo.ps1 to pick up — see /run-local-demo.ps1.
fs_permissions = [{ access = "read-write", path = "./" }]

# Robinhood Chain is a standard EVM (Arbitrum Orbit L2), gas in ETH.
# Fill these in once you have real endpoints/keys — never commit the key itself,
# set ROBINHOOD_RPC_URL / ROBINHOOD_PRIVATE_KEY as environment variables instead.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
robinhood = { key = "${ROBINHOOD_ETHERSCAN_KEY}", url = "${ROBINHOOD_ETHERSCAN_API_URL}" }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
